name: Prueba Token Secrets

on: [push]

jobs:
  comprobar-token:
    runs-on: self-hosted
    defaults:
      run:
        shell: powershell
    steps:
      - name: Comprobar token DEV contra variable local
        env:
          DEV_SECRET: ${{ secrets.DEV_TOKEN }}
        run: |
          if ($env:DEV_SECRET -eq $env:LOCAL_DEV_TOKEN) {
              Write-Output "Los tokens COINCIDEN correctamente."
              exit 0
          } else {
              Write-Output "ERROR: Los tokens NO coinciden."
              exit 1
          }
